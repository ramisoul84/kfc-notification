<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Welcome to KFC CRM</title>
</head>

<body style="font-family: Arial, sans-serif; color: #222; line-height: 1.5;">
    <h2 style="margin-bottom: 16px;">Welcome to KFC CRM</h2>

    <p>Hello,</p>

    <p>Your account has been created with the role <strong>{{.RoleName}}</strong>.</p>

    <p style="margin: 16px 0;">
        <strong>Initial password:</strong>
        <code style="background: #f4f4f4; padding: 2px 6px; border-radius: 4px;">{{.Password}}</code>
    </p>

    <p>For security, please log in and change your password immediately.</p>

    <p style="margin-top: 24px; color: #666;">— KFC CRM</p>
</body>

</html>
